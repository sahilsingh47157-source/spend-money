<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise — Smart Fintech & AI Expense Tracker</title>
  
  <!-- Tailwind CSS & Lucide Icons & Chart.js -->

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',

        extend: {

            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }

        }
      }
    }

    }

      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;

      box-shadow: 0 0 25px rgba(99, 102, 241, 0.45);
    }

</head>

<body class="h-full bg-slate-50 dark:bg-[#0b0f19] text-slate-800 dark:text-slate-100 transition-colors duration-200">
  <div id="app" class="h-full flex flex-col"></div>

  <script>
    // ==========================================
    // MULTI-USER STORAGE ARCHITECTURE
    // ==========================================
    
    // Seed default demo account (Alex) once if not present
    function initUserDatabase() {
      let users = JSON.parse(localStorage.getItem('spendwise_all_users'));
      if (!users || !Array.isArray(users) || users.length === 0) {
        users = [
          {
            name: "Alex Morgan",
            email: "alex@spendwise.io",
            password: "password123",
            currency: "₹",
            monthlyBudget: 25000,
            darkMode: false,
            apiKey: ""
          }
        ];
        localStorage.setItem('spendwise_all_users', JSON.stringify(users));

        // Seed demo transactions for Alex only
        const demoTx = [
          { id: "tx-1", title: "Freelance Retainer", amount: 35000, type: "income", category: "Salary", paymentMethod: "UPI", date: "2026-09-28", time: "10:00 AM", note: "Web App deliverable" },
          { id: "tx-2", title: "Grocery & Food", amount: 3200, type: "expense", category: "Food", paymentMethod: "Credit Card", date: "2026-09-28", time: "06:30 PM", note: "Supermarket" },
          { id: "tx-3", title: "Metro Pass", amount: 800, type: "expense", category: "Travel", paymentMethod: "UPI", date: "2026-09-27", time: "09:15 AM", note: "Commute" },
          { id: "tx-4", title: "Cloud Hosting", amount: 1450, type: "expense", category: "Bills", paymentMethod: "Debit Card", date: "2026-09-26", time: "02:20 PM", note: "Servers" },
          { id: "tx-5", title: "Movie Night", amount: 950, type: "expense", category: "Entertainment", paymentMethod: "UPI", date: "2026-09-25", time: "08:45 PM", note: "Cinema" }
        ];
        localStorage.setItem('spendwise_tx_alex@spendwise.io', JSON.stringify(demoTx));
      }
    }
    initUserDatabase();

    // Session State
    const activeEmail = localStorage.getItem('spendwise_active_email') || null;
    const isLogged = localStorage.getItem('spendwise_auth') === 'true' && !!activeEmail;

    function getCurrentUserData(email) {
      const users = JSON.parse(localStorage.getItem('spendwise_all_users')) || [];
      return users.find(u => u.email.toLowerCase() === (email || '').toLowerCase()) || null;
    }

    function getCurrentUserTransactions(email) {
      if (!email) return [];
      const tx = localStorage.getItem(`spendwise_tx_${email.toLowerCase()}`);
      return tx ? JSON.parse(tx) : [];
    }

    const state = {
      currentUser: isLogged ? getCurrentUserData(activeEmail) : null,
      transactions: isLogged ? getCurrentUserTransactions(activeEmail) : [],
      isLoggedIn: isLogged,
      currentPage: isLogged ? 'dashboard' : 'landing', // landing, login, signup, dashboard, analytics, budget, transactions, settings
      activeModal: null, // 'expense', 'income', 'budget', 'aiKey', 'editTx'
      editingTx: null,
      filterType: 'all',
      filterCategory: 'all',
      searchQuery: '',
      sortField: 'date-desc',
      aiChatOpen: false,
      aiApiKey: localStorage.getItem('spendwise_gemini_api_key') || '',
      aiMessages: [
        {
          role: 'model',
          text: "Hi! I am SpendWise Financial Copilot powered by Gemini 3.5 Flash-Lite. You can ask me to log expenses, check your remaining budget, analyze categories, or manage transactions.",
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }
      ],
      aiThinking: false
    };

    function persistCurrentUserData() {
      if (!state.currentUser) return;
      const users = JSON.parse(localStorage.getItem('spendwise_all_users')) || [];
      const idx = users.findIndex(u => u.email.toLowerCase() === state.currentUser.email.toLowerCase());
      if (idx !== -1) {
        users[idx] = state.currentUser;
        localStorage.setItem('spendwise_all_users', JSON.stringify(users));
      }
      localStorage.setItem(`spendwise_tx_${state.currentUser.email.toLowerCase()}`, JSON.stringify(state.transactions));
      localStorage.setItem('spendwise_auth', state.isLoggedIn);
      localStorage.setItem('spendwise_active_email', state.currentUser.email);
      localStorage.setItem('spendwise_gemini_api_key', state.aiApiKey);
    }

    function applyTheme() {
      if (state.currentUser && state.currentUser.darkMode) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
    applyTheme();

    // ==========================================
    // FINANCIAL CALCULATION ENGINE
    // ==========================================
    function getFinancials() {
      const income = state.transactions
        .filter(t => t.type === 'income')
        .reduce((sum, t) => sum + Number(t.amount), 0);

      const expenses = state.transactions
        .filter(t => t.type === 'expense')
        .reduce((sum, t) => sum + Number(t.amount), 0);

      const balance = income - expenses;
      const budget = Number(state.currentUser?.monthlyBudget) || 0;
      
      const budgetUsedPercent = budget > 0 ? ((expenses / budget) * 100).toFixed(1) : "0.0";
      const remainingBudget = budget - expenses;

      let suggestion = "Start adding your income or expenses to track your spending habits.";
      let suggestionLevel = "info";
      
      if (budget > 0) {
        const pct = Number(budgetUsedPercent);
        if (pct > 100) {
          suggestion = "You have exceeded your planned monthly budget.";
          suggestionLevel = "danger";
        } else if (pct >= 90) {
          suggestion = "Your budget is almost fully used. Consider limiting non-essential spending.";
          suggestionLevel = "danger";
        } else if (pct >= 75) {
          suggestion = "You are approaching your monthly expense limit. Consider reviewing upcoming expenses.";
          suggestionLevel = "warning";
        } else if (pct >= 50) {
          suggestion = `You have used ${budgetUsedPercent}% of your monthly budget. Keep tracking your expenses.`;
          suggestionLevel = "info";
        } else {
          suggestion = "You're comfortably within your planned budget.";
          suggestionLevel = "success";
        }
      }

      return {
        income,
        expenses,
        balance,
        budget,
        budgetUsedPercent,
        remainingBudget,
        suggestion,
        suggestionLevel
      };
    }

    function formatCurrency(amount) {
      const curr = state.currentUser ? state.currentUser.currency : "₹";
      return `${curr}${Number(amount || 0).toLocaleString('en-IN')}`;
    }

    function showToast(message, type = 'info') {
      const existing = document.getElementById('toast-notification');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.id = 'toast-notification';
      const color = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-indigo-600';
      toast.className = `fixed top-6 right-6 z-50 ${color} text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 text-sm font-medium animate-bounce`;
      toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle-2' : type === 'error' ? 'alert-circle' : 'info'}" class="w-5 h-5"></i> <span>${message}</span>`;
      document.body.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // ==========================================
    // GEMINI TOOLS DISPATCHER
    // ==========================================
    const GEMINI_TOOLS_DECLARATION = {
      function_declarations: [
        {
          name: "addExpense",
          description: "Add a new expense transaction.",
          parameters: {
            type: "OBJECT",
            properties: {
              title: { type: "STRING", description: "Expense item name (e.g. Lunch, Uber, Wifi)" },
              amount: { type: "NUMBER", description: "Expense amount" },
              category: { 
                type: "STRING", 
                enum: ["Food", "Travel", "Shopping", "Education", "Bills", "Entertainment", "Health", "Other"] 
              },
              paymentMethod: { type: "STRING", enum: ["Cash", "UPI", "Debit Card", "Credit Card", "Other"] },
              note: { type: "STRING" }
            },
            required: ["title", "amount", "category"]
          }
        },
        {
          name: "addIncome",
          description: "Add a new income credit transaction.",
          parameters: {
            type: "OBJECT",
            properties: {
              title: { type: "STRING", description: "Income source title" },
              amount: { type: "NUMBER", description: "Income amount" },
              category: { type: "STRING" },
              paymentMethod: { type: "STRING" }
            },
            required: ["title", "amount"]
          }
        },
        {
          name: "setMonthlyBudget",
          description: "Configure or update monthly budget limit.",
          parameters: {
            type: "OBJECT",
            properties: {
              amount: { type: "NUMBER", description: "Monthly budget limit" }
            },
            required: ["amount"]
          }
        },
        {
          name: "getFinancialSummary",
          description: "Get real-time balance, income, expenses, and budget usage.",
          parameters: { type: "OBJECT", properties: {} }
        },
        {
          name: "navigateToPage",
          description: "Switch active app view.",
          parameters: {
            type: "OBJECT",
            properties: {
              page: { type: "STRING", enum: ["dashboard", "analytics", "budget", "transactions", "settings"] }
            },
            required: ["page"]
          }
        },
        {
          name: "toggleTheme",
          description: "Switch between dark and light themes.",
          parameters: {
            type: "OBJECT",
            properties: { mode: { type: "STRING", enum: ["dark", "light"] } },
            required: ["mode"]
          }
        }
      ]
    };

    async function executeAppTool(name, args) {
      const now = new Date();
      const dateStr = now.toISOString().split('T')[0];
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      switch (name) {
        case 'addExpense': {
          const newTx = {
            id: 'tx-' + Date.now(),
            title: args.title,
            amount: Number(args.amount),
            type: 'expense',
            category: args.category || 'Other',
            paymentMethod: args.paymentMethod || 'UPI',
            date: dateStr,
            time: timeStr,
            note: args.note || 'Logged via Gemini AI'
          };
          state.transactions.unshift(newTx);
          persistCurrentUserData();
          renderApp();
          showToast(`Expense added: ${formatCurrency(newTx.amount)}`, 'success');
          return { success: true, message: `Added ${formatCurrency(newTx.amount)} for ${newTx.title}`, financials: getFinancials() };
        }
        case 'addIncome': {
          const newTx = {
            id: 'tx-' + Date.now(),
            title: args.title,
            amount: Number(args.amount),
            type: 'income',
            category: args.category || 'Salary',
            paymentMethod: args.paymentMethod || 'UPI',
            date: dateStr,
            time: timeStr,
            note: 'Logged via Gemini AI'
          };
          state.transactions.unshift(newTx);
          persistCurrentUserData();
          renderApp();
          showToast(`Income added: ${formatCurrency(newTx.amount)}`, 'success');
          return { success: true, message: `Credited ${formatCurrency(newTx.amount)} from ${newTx.title}`, financials: getFinancials() };
        }
        case 'setMonthlyBudget': {
          state.currentUser.monthlyBudget = Number(args.amount);
          persistCurrentUserData();
          renderApp();
          showToast(`Budget updated to ${formatCurrency(args.amount)}`, 'success');
          return { success: true, newBudget: args.amount, financials: getFinancials() };
        }
        case 'getFinancialSummary': {
          return { success: true, summary: getFinancials() };
        }
        case 'navigateToPage': {
          state.currentPage = args.page;
          renderApp();
          return { success: true, navigatedTo: args.page };
        }
        case 'toggleTheme': {
          state.currentUser.darkMode = args.mode === 'dark';
          applyTheme();
          persistCurrentUserData();
          renderApp();
          return { success: true, theme: state.currentUser.darkMode ? 'dark' : 'light' };
        }
        default:
          return { success: false, error: 'Unknown tool' };
      }
    }

    async function sendPromptToGemini(userText) {
      state.aiMessages.push({
        role: 'user',
        text: userText,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      state.aiThinking = true;
      renderApp();

      const apiKey = state.aiApiKey.trim();

      // Intelligent Fallback if API Key is not set
      if (!apiKey) {
        setTimeout(async () => {
          const lower = userText.toLowerCase();
          let reply = "";
          if (lower.includes("expense") || lower.includes("spent") || lower.includes("paid")) {
            const num = (userText.match(/\d+/) || [200])[0];
            await executeAppTool('addExpense', { title: "Quick Expense", amount: Number(num), category: "Food" });
            reply = `Recorded an expense of ${formatCurrency(num)}. (Add your AI Studio API key in settings for full Gemini 3.5 reasoning!)`;
          } else if (lower.includes("income") || lower.includes("salary")) {
            const num = (userText.match(/\d+/) || [5000])[0];
            await executeAppTool('addIncome', { title: "Funds Received", amount: Number(num), category: "Salary" });
            reply = `Credited income of ${formatCurrency(num)}. Balance updated!`;
          } else if (lower.includes("dark") || lower.includes("light")) {
            await executeAppTool('toggleTheme', { mode: lower.includes("dark") ? 'dark' : 'light' });
            reply = "Theme updated.";
          } else {
            const f = getFinancials();
            reply = `Your available balance is ${formatCurrency(f.balance)}. Inflow: ${formatCurrency(f.income)} | Outflow: ${formatCurrency(f.expenses)}.`;
          }
          state.aiMessages.push({
            role: 'model',
            text: reply,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
          state.aiThinking = false;
          renderApp();
        }, 500);
        return;
      }

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`;
        const contents = [
          {
            role: "user",
            parts: [{
              text: `You are SpendWise AI copilot for user ${state.currentUser?.name}. Current date: ${new Date().toDateString()}. Currency: ${state.currentUser?.currency || '₹'}. Execute tools where relevant.`
            }]
          }
        ];

        state.aiMessages.slice(-5).forEach(m => {
          if (!m.toolExec) {
            contents.push({ role: m.role === 'model' ? 'model' : 'user', parts: [{ text: m.text }] });
          }
        });

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents,
            tools: [{ functionDeclarations: GEMINI_TOOLS_DECLARATION.function_declarations }]
          })
        });

        const data = await res.json();
        const part = data.candidates?.[0]?.content?.parts?.[0];

        if (part?.functionCall) {
          const { name, args } = part.functionCall;
          state.aiMessages.push({
            role: 'model',
            toolExec: true,
            text: `⚡ Action: ${name} (${JSON.stringify(args)})`,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
          renderApp();

          const result = await executeAppTool(name, args);
          state.aiMessages.push({
            role: 'model',
            text: result.message || `Successfully executed ${name}.`,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
        } else if (part?.text) {
          state.aiMessages.push({
            role: 'model',
            text: part.text,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
        }
      } catch (err) {
        state.aiMessages.push({
          role: 'model',
          text: `⚠️ Gemini API Error: ${err.message}`,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
      } finally {
        state.aiThinking = false;
        renderApp();
      }
    }

    // RENDERING LOGIC & UI PAGES
    // ==========================================

    function renderAuthPage(type = 'login') {
      const isLogin = type === 'login';
      return `
        <div class="flex-1 flex items-center justify-center p-6 overflow-y-auto">
          <div class="w-full max-w-md bg-white dark:bg-[#131b2e] rounded-3xl p-8 border border-slate-200 dark:border-slate-800 shadow-2xl">
            <div class="text-center mb-8">
              <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-600/30">
                <i data-lucide="wallet" class="w-6 h-6"></i>
              </div>
              <h2 class="text-2xl font-extrabold">${isLogin ? 'Sign In to SpendWise' : 'Create a Brand New Account'}</h2>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">

              </p>
            </div>

            <form onsubmit="handleAuthSubmit(event, '${type}')" class="space-y-4">
              ${!isLogin ? `
                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Full Name</label>

                </div>
              ` : ''}

              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Email / Username</label>
                <input type="email" id="auth-email" required placeholder="name@example.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>

              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Password</label>
                <input type="password" id="auth-password" required minlength="6" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>

              ${!isLogin ? `
                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Confirm Password</label>
                  <input type="password" id="auth-confirm" required minlength="6" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
              ` : `
                <div class="flex items-center justify-between text-xs text-slate-500">
                  <span>Demo login: <strong>alex@spendwise.io</strong> / <strong>password123</strong></span>
                </div>
              `}

              <div id="auth-error" class="hidden text-xs text-rose-500 font-medium"></div>

              <button type="submit" class="w-full py-3.5 rounded-xl font-bold bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg shadow-indigo-600/25 transition">
                ${isLogin ? 'Sign In' : 'Register & Start Clean (₹0)'}

            </form>

                <div class="grid grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Category</label>
                    <select id="exp-category" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs">
                      <option value="Food">Food</option>
                      <option value="Travel">Travel</option>
                      <option value="Shopping">Shopping</option>
                      <option value="Bills">Bills</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Payment Method</label>
                    <select id="exp-method" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs">
                      <option value="UPI">UPI</option>
                      <option value="Cash">Cash</option>
                      <option value="Debit Card">Debit Card</option>
                      <option value="Credit Card">Credit Card</option>
                    </select>
                  </div>
                </div>
                <input type="hidden" id="exp-date" value="${defaultDate}">
                <input type="hidden" id="exp-time" value="${defaultTime}">
                <div class="flex justify-end gap-3 pt-2">
                  <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl border text-xs font-bold">Cancel</button>
                  <button type="submit" class="px-6 py-2.5 rounded-xl bg-rose-600 text-white text-xs font-bold">Save Expense</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      if (state.activeModal === 'income') {
        return `
          <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="w-full max-w-md bg-white dark:bg-[#131b2e] rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-2xl">
              <h3 class="text-lg font-extrabold mb-4">Add Income</h3>
              <form onsubmit="handleCreateIncome(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Amount (${state.currentUser?.currency || '₹'}) *</label>
                  <input type="number" step="0.01" min="1" id="inc-amount" required placeholder="0.00" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm font-bold">
                </div>
                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Income Title *</label>
                  <input type="text" id="inc-title" required placeholder="e.g. Salary, Client payment" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Category</label>
                    <select id="inc-category" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs">
                      <option value="Salary">Salary</option>
                      <option value="Freelance">Freelance</option>
                      <option value="Investments">Investments</option>
                      <option value="Pocket Money">Pocket Money</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Payment Method</label>
                    <select id="inc-method" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs">
                      <option value="UPI">UPI</option>
                      <option value="Bank Transfer">Bank Transfer</option>
                      <option value="Cash">Cash</option>
                    </select>
                  </div>
                </div>
                <input type="hidden" id="inc-date" value="${defaultDate}">
                <input type="hidden" id="inc-time" value="${defaultTime}">
                <div class="flex justify-end gap-3 pt-2">
                  <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl border text-xs font-bold">Cancel</button>
                  <button type="submit" class="px-6 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-bold">Save Income</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      if (state.activeModal === 'budget') {
        return `
          <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="w-full max-w-md bg-white dark:bg-[#131b2e] rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-2xl">
              <h3 class="text-lg font-extrabold mb-4">Set Monthly Budget</h3>
              <form onsubmit="handleSetBudget(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Budget Limit (${state.currentUser?.currency || '₹'})</label>
                  <input type="number" min="0" id="budget-input" value="${state.currentUser?.monthlyBudget || 0}" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-base font-extrabold">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                  <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl border text-xs font-bold">Cancel</button>
                  <button type="submit" class="px-6 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold">Save Budget</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      if (state.activeModal === 'aiKey') {
        return `
          <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="w-full max-w-md bg-white dark:bg-[#131b2e] rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-2xl">
              <h3 class="text-lg font-extrabold mb-2">Google AI Studio API Key</h3>
              <p class="text-xs text-slate-400 mb-4">Powers the Gemini 3.5 Flash-Lite Copilot with tools.</p>
              <input type="password" id="modal-api-key" placeholder="AIzaSy..." value="${state.aiApiKey}" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs font-mono mb-4">
              <div class="flex justify-end gap-3">
                <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl border text-xs font-bold">Cancel</button>
                <button type="button" onclick="saveApiKeyFromModal()" class="px-6 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold">Save Key</button>
              </div>
            </div>
          </div>
        `;
      }

      return '';
    }

    function renderAIChatDrawer() {
      if (!state.isLoggedIn) return '';

      return `
        <button onclick="toggleAIChat()" class="fixed right-6 bottom-8 z-40 px-4 py-3 rounded-full bg-gradient-to-r from-indigo-600 to-violet-700 text-white shadow-2xl flex items-center gap-2.5 hover:scale-105 transition pulse-glow">
          <i data-lucide="sparkles" class="w-5 h-5 text-amber-300"></i>
          <span class="text-xs font-bold">Gemini 3.5 Copilot</span>
        </button>

        <div id="ai-chat-panel" class="fixed right-4 bottom-20 z-50 w-[92vw] sm:w-[400px] h-[520px] bg-white dark:bg-[#131b2e] rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col overflow-hidden transition-all duration-300 ${
          state.aiChatOpen ? 'opacity-100 scale-100 pointer-events-auto' : 'opacity-0 scale-95 pointer-events-none'
        }">
          <div class="p-4 bg-gradient-to-r from-indigo-600 to-violet-600 text-white flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="bot" class="w-5 h-5"></i>
              <span class="text-xs font-bold">SpendWise AI (Gemini 3.5)</span>
            </div>
            <button onclick="toggleAIChat()" class="p-1 rounded hover:bg-white/10">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>

          <div id="ai-messages-scroll" class="flex-1 p-4 overflow-y-auto custom-scrollbar space-y-3 text-xs">
            ${state.aiMessages.map(msg => `
              <div class="flex flex-col ${msg.role === 'user' ? 'items-end' : 'items-start'}">
                <div class="max-w-[85%] rounded-2xl px-4 py-2.5 ${msg.role === 'user' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200'}">
                  ${msg.text}
                </div>
                <span class="text-[9px] text-slate-400 mt-1">${msg.timestamp}</span>
              </div>
            `).join('')}

            ${state.aiThinking ? `
              <div class="flex items-center gap-2 text-slate-400 text-xs italic">
                <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-indigo-500"></i>
                Processing tool actions...
              </div>
            ` : ''}
          </div>

          <form onsubmit="handleAIChatSubmit(event)" class="p-3 bg-white dark:bg-[#131b2e] border-t border-slate-100 dark:border-slate-800 flex items-center gap-2">
            <input type="text" id="ai-chat-input" placeholder="Type: 'Add 200 for coffee' or 'Show balance'..." class="flex-1 px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs focus:outline-none">
            <button type="submit" class="p-2.5 rounded-xl bg-indigo-600 text-white"><i data-lucide="send" class="w-4 h-4"></i></button>
          </form>
        </div>
      `;
    }

    function renderApp() {
      const appEl = document.getElementById('app');

      if (!state.isLoggedIn) {
        if (state.currentPage === 'signup') {
          appEl.innerHTML = renderAuthPage('signup');
        } else if (state.currentPage === 'login') {
          appEl.innerHTML = renderAuthPage('login');
        } else {
          appEl.innerHTML = renderLandingPage();
        }
      } else {
        let content = '';
        if (state.currentPage === 'dashboard') content = renderDashboardView();
        else if (state.currentPage === 'transactions') content = renderTransactionsPage();
        else if (state.currentPage === 'analytics') content = renderAnalyticsPage();
        else if (state.currentPage === 'budget') content = renderBudgetPage();
        else if (state.currentPage === 'settings') content = renderSettingsPage();
        else content = renderDashboardView();

        appEl.innerHTML = `
          <div class="flex-1 flex overflow-hidden">
            ${renderSidebar()}
            <main class="flex-1 overflow-y-auto custom-scrollbar p-6 sm:p-8 pb-24 lg:pb-8">
              ${renderDashboardHeader()}
              ${content}
            </main>
          </div>
          ${renderModals()}
          ${renderAIChatDrawer()}
        `;

        if (state.currentPage === 'analytics') {
          setTimeout(initCharts, 50);
        }
      }

      lucide.createIcons();
    }

    // ==========================================
    // AUTHENTICATION LOGIC (USER DATA RESET)
    // ==========================================
    function handleAuthSubmit(e, type) {
      e.preventDefault();
      const users = JSON.parse(localStorage.getItem('spendwise_all_users')) || [];

      if (type === 'signup') {
        const name = document.getElementById('auth-name').value.trim();
        const email = document.getElementById('auth-email').value.trim().toLowerCase();
        const pwd = document.getElementById('auth-password').value;
        const confirm = document.getElementById('auth-confirm').value;

        if (pwd !== confirm) {
          const err = document.getElementById('auth-error');
          err.textContent = "Passwords do not match.";
          err.classList.remove('hidden');
          return;
        }

        const existing = users.find(u => u.email.toLowerCase() === email);
        if (existing) {
          const err = document.getElementById('auth-error');
          err.textContent = "Account with this email already exists! Please log in.";
          err.classList.remove('hidden');
          return;
        }

        // Create Brand New Fresh User with ₹0 starting balances
        const newUser = {
          name,
          email,
          password: pwd,
          currency: "₹",
          monthlyBudget: 0,
          darkMode: false
        };

        users.push(newUser);
        localStorage.setItem('spendwise_all_users', JSON.stringify(users));

        // Explicitly set zero / empty transactions for this user
        localStorage.setItem(`spendwise_tx_${email}`, JSON.stringify([]));

        // Log in immediately as the new user
        state.currentUser = newUser;
        state.transactions = [];
        state.isLoggedIn = true;
        state.currentPage = 'dashboard';
        persistCurrentUserData();

        showToast(`Welcome ${name}! Your new account is ready with ₹0 balance.`, "success");
        renderApp();
      } else {
        // Login Flow
        const email = document.getElementById('auth-email').value.trim().toLowerCase();
        const pwd = document.getElementById('auth-password').value;

        const user = users.find(u => u.email.toLowerCase() === email && u.password === pwd);
        if (!user) {
          const err = document.getElementById('auth-error');
          err.textContent = "Invalid email or password.";
          err.classList.remove('hidden');
          return;
        }

        state.currentUser = user;
        state.transactions = getCurrentUserTransactions(email);
        state.isLoggedIn = true;
        state.currentPage = 'dashboard';
        persistCurrentUserData();
        applyTheme();

        showToast(`Welcome back, ${user.name}!`, "success");
        renderApp();
      }
    }

    function handleLogout() {
      state.isLoggedIn = false;
      state.currentUser = null;
      state.transactions = [];
      localStorage.removeItem('spendwise_auth');
      localStorage.removeItem('spendwise_active_email');
      state.currentPage = 'landing';
      showToast("Logged out successfully.", "info");
      renderApp();
    }

    // Modal & App Actions
    function navigateTo(page) {
      state.currentPage = page;
      renderApp();
    }

    function toggleThemeGlobal() {
      if (!state.currentUser) return;
      state.currentUser.darkMode = !state.currentUser.darkMode;
      applyTheme();
      persistCurrentUserData();
      renderApp();
    }

    function openModal(name) {
      state.activeModal = name;
      renderApp();
    }

    function closeModal() {
      state.activeModal = null;
      renderApp();
    }

    function toggleAIChat() {
      state.aiChatOpen = !state.aiChatOpen;
      renderApp();
    }

    function handleAIChatSubmit(e) {
      e.preventDefault();
      const inp = document.getElementById('ai-chat-input');
      const val = inp.value.trim();
      if (!val) return;
      inp.value = '';
      sendPromptToGemini(val);
    }

    function handleCreateExpense(e) {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('exp-amount').value);
      const title = document.getElementById('exp-title').value.trim();
      const category = document.getElementById('exp-category').value;
      const paymentMethod = document.getElementById('exp-method').value;
      const date = document.getElementById('exp-date').value;
      const time = document.getElementById('exp-time').value;

      state.transactions.unshift({
        id: 'tx-' + Date.now(),
        title,
        amount,
        type: 'expense',
        category,
        paymentMethod,
        date,
        time
      });

      persistCurrentUserData();
      closeModal();
      showToast(`Expense added: ${formatCurrency(amount)}`, 'success');
      renderApp();
    }

    function handleCreateIncome(e) {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('inc-amount').value);
      const title = document.getElementById('inc-title').value.trim();
      const category = document.getElementById('inc-category').value;
      const paymentMethod = document.getElementById('inc-method').value;
      const date = document.getElementById('inc-date').value;
      const time = document.getElementById('inc-time').value;

      state.transactions.unshift({
        id: 'tx-' + Date.now(),
        title,
        amount,
        type: 'income',
        category,
        paymentMethod,
        date,
        time
      });

      persistCurrentUserData();
      closeModal();
      showToast(`Income credited: ${formatCurrency(amount)}`, 'success');
      renderApp();
    }

    function handleSetBudget(e) {
      e.preventDefault();
      const val = parseFloat(document.getElementById('budget-input').value);
      state.currentUser.monthlyBudget = val;
      persistCurrentUserData();
      closeModal();
      showToast(`Monthly budget set to ${formatCurrency(val)}`, 'success');
      renderApp();
    }

    function confirmDeleteTransaction(id) {
      state.transactions = state.transactions.filter(t => t.id !== id);
      persistCurrentUserData();
      showToast("Transaction removed.", "info");
      renderApp();
    }

    function saveApiKeyFromModal() {
      state.aiApiKey = document.getElementById('modal-api-key').value.trim();
      localStorage.setItem('spendwise_gemini_api_key', state.aiApiKey);
      closeModal();
      showToast("API Key Saved!", "success");
      renderApp();
    }

    function saveApiKeyFromSettings() {
      state.aiApiKey = document.getElementById('settings-api-key').value.trim();
      localStorage.setItem('spendwise_gemini_api_key', state.aiApiKey);
      showToast("API Key Saved!", "success");
      renderApp();
    }

    // Chart.js initialization
    let flowChart = null;
    let catChart = null;
    function initCharts() {
      const fin = getFinancials();
      const flowEl = document.getElementById('chart-flow');
      if (flowEl) {
        if (flowChart) flowChart.destroy();
        flowChart = new Chart(flowEl, {
          type: 'bar',
          data: {
            labels: ['Income', 'Expenses', 'Vault Balance'],
            datasets: [{
              data: [fin.income, fin.expenses, Math.max(0, fin.balance)],
              backgroundColor: ['#10b981', '#f43f5e', '#6366f1'],
              borderRadius: 8
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
      }

      const catEl = document.getElementById('chart-categories');
      if (catEl) {
        if (catChart) catChart.destroy();
        const map = {};
        state.transactions.filter(t => t.type === 'expense').forEach(t => {
          map[t.category] = (map[t.category] || 0) + Number(t.amount);
        });
        const labels = Object.keys(map);
        catChart = new Chart(catEl, {
          type: 'doughnut',
          data: {
            labels: labels.length ? labels : ['No Data'],
            datasets: [{
              data: labels.length ? Object.values(map) : [1],
              backgroundColor: ['#6366f1', '#f43f5e', '#10b981', '#f59e0b', '#8b5cf6'],
              borderWidth: 0
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
